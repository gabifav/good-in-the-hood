<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spud Post Maker</title>
<meta name="theme-color" content="#c9955c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&family=Caveat:wght@600;700&display=swap">
<style>
  :root { --bg:#eef2e4; --paper:#fffdf7; --ink:#3b2a20; --soft:#6f5a4b; --spud:#c9955c; --spudD:#9c6c3c; --sprout:#6f9c5a; --butter:#ffd978; --blush:#ef9f98; --line:#e2dccd; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Nunito", system-ui, sans-serif; }
  header { padding: 14px max(16px, env(safe-area-inset-left)) 6px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  header h1 { margin: 0; font-family: "Fredoka", sans-serif; font-size: 24px; }
  header span { font-family: "Caveat", cursive; font-size: 22px; color: var(--spudD); }
  main { max-width: 980px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-left)) 120px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--paper); border-radius: 14px; padding: 14px; box-shadow: 0 8px 20px -16px rgba(59,42,32,.6); display: grid; gap: 10px; min-width: 0; }
  .stage { position: sticky; top: 8px; }
  @media (max-width: 760px) { .stage { position: static; } }
  canvas { width: 100%; height: auto; border-radius: 10px; display: block; box-shadow: 0 2px 10px rgba(59,42,32,.15); }
  label { font-weight: 700; font-size: 13px; display: block; margin-bottom: 4px; }
  input, textarea { width: 100%; font: inherit; font-size: 16px; border: 2px solid var(--line); border-radius: 10px; padding: 9px 11px; background: #fff; color: var(--ink); }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--spud); }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 6px 10px; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
  .opt.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--butter); }
  .opt i { width: 18px; height: 18px; border-radius: 6px; display: inline-block; border: 1px solid rgba(0,0,0,.15); }
  .btn { border: none; border-radius: 12px; padding: 11px 14px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; background: var(--butter); color: var(--ink); }
  .btn.green { background: var(--sprout); color: #fff; }
  .btn.ghost { background: #fff; border: 2px solid var(--line); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .slides { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .thumb { flex: none; width: 64px; border-radius: 8px; border: 3px solid transparent; cursor: pointer; padding: 0; background: none; }
  .thumb img { width: 100%; display: block; border-radius: 5px; }
  .thumb.on { border-color: var(--spud); }
  .addslide { flex: none; width: 64px; aspect-ratio: 4/5; border: 2px dashed var(--line); border-radius: 8px; background: #fff; font-size: 26px; color: var(--soft); cursor: pointer; }
  .hint { font-size: 13px; color: var(--soft); margin: 0; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 2px solid var(--line); padding: 10px max(16px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; z-index: 5; }
  .bar .btn { flex: 1; max-width: 300px; font-size: 16px; padding: 13px; }
  .ideas { display: grid; gap: 6px; max-height: 260px; overflow-y: auto; }
  .idea { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); }
  .idea b { display: block; font-size: 12px; color: var(--spudD); }
  .toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 12px; z-index: 9; font-weight: 700; transition: opacity .4s; }
  details summary { cursor: pointer; font-weight: 700; }
</style>
</head>
<body>
<header><h1>Spud Post Maker</h1><span>sincerely, spud</span></header>
<main>
  <div class="card stage">
    <canvas id="cv" width="1080" height="1350" aria-label="Post preview"></canvas>
    <div class="slides" id="slides"></div>
    <p class="hint">Tap + to add carousel slides. Each slide is its own letter.</p>
  </div>

  <div class="card">
    <div><label for="to">"to:" line</label><input id="to" maxlength="60" placeholder="to: you, on a slow day"></div>
    <div><label for="msg">The letter</label><textarea id="msg" maxlength="320" placeholder="being a couch potato today is allowed. potatoes need rest to grow."></textarea></div>
    <div><label for="sig">Signed</label><input id="sig" maxlength="40" value="sincerely, spud"></div>
    <div><label>Background</label><div class="opts" id="bgs"></div></div>
    <div><label>Who's writing?</label><div class="opts" id="moods"></div><p class="hint" id="about" style="margin-top:6px"></p></div>
    <div class="row">
      <button class="btn ghost" id="idea">💡 Write me a letter</button>
      <button class="btn ghost" id="dupe">⧉ Copy slide</button>
      <button class="btn ghost" id="del">✕ Delete slide</button>
    </div>
    <details>
      <summary>📝 Ready-written letters (your first 9 posts are at the top)</summary>
      <div class="ideas" id="ideas" style="margin-top:8px"></div>
    </details>
    <div><label for="handle">Your handle (shown small on every post)</label><input id="handle" maxlength="30" placeholder="@sincerely.spud" autocapitalize="off" autocomplete="off"></div>
  </div>
</main>
<div class="bar">
  <button class="btn green" id="save">💾 Save post to phone</button>
</div>

<script>
(() => {
  const BGS = {
    butter: { name: 'Butter', bg: '#fff3d1', ink: '#3b2a20', accent: '#9c6c3c' },
    sprout: { name: 'Sprout', bg: '#e3eed8', ink: '#2f3a24', accent: '#5d8a49' },
    blush:  { name: 'Blush letter', bg: '#fbe3df', ink: '#4a2a28', accent: '#b5574f', lined: true },
    paper:  { name: 'Paper', bg: '#fffdf7', ink: '#3b2a20', accent: '#9c6c3c', lined: true },
    soil:   { name: 'Night', bg: '#3b2a20', ink: '#fff6e6', accent: '#ffd978' },
  };
  // The potato cast. Each one has their own look, sign-off and way of talking.
  const CAST = {
    spud:     { name: 'Spud', label: '🎀 Spud', sig: 'sincerely, spud', bg: 'blush', about: 'The original. Sweet, honest, a little shy. Writes the everyday letters.' },
    princess: { name: 'Princess Potato', label: '👑 Princess', sig: 'royally yours, princess potato', bg: 'blush', about: 'Even princesses need potato days. Dramatic about rest, regal about self-worth.' },
    couch:    { name: 'Couch Potato', label: '🛋️ Couch Potato', sig: 'lazily, couch potato', bg: 'paper', about: 'Professional rester. Reminds everyone that rest is productive.' },
    hype:     { name: 'Hype Potato', label: '📣 Hype Potato', sig: 'LOUDLY, hype potato', bg: 'butter', about: 'Your biggest cheerleader. ALL CAPS energy, celebrates every small win.' },
    nana:     { name: 'Nana Spud', label: '👓 Nana Spud', sig: 'love always, nana spud', bg: 'paper', about: 'Wise, warm and been through it all. Gentle advice and perspective.' },
    tot:      { name: 'Tater Tot', label: '✨ Tater Tot', sig: 'smol regards, tater tot', bg: 'sprout', about: 'Tiny and new to everything. Celebrates the smallest wins and asks big questions.' },
    spicy:    { name: 'Hot Potato', label: '🕶️ Hot Potato', sig: 'no notes, hot potato', bg: 'soil', about: 'Confident and a little sassy. Boundaries, self-respect and walking away.' },
    sweet:    { name: 'Sweet Potato', label: '🧡 Sweet Potato', sig: 'all my love, sweet potato', bg: 'butter', about: 'The softest one. Comfort on hard days, big hugs, extra gentle.' },
  };
  const IDEAS = [
    // your first 9 posts: introduce the cast
    ['Starter 1 · meet Spud', 'to: you, new here', 'hi, i\'m spud. a small, slightly lumpy potato with a bow. i\'ll be leaving you little letters. you don\'t have to be perfect to read them.', 'spud'],
    ['Starter 2 · meet Couch Potato', 'to: you, on a slow day', 'hi, i\'m couch potato. today\'s plan: blanket, snacks, nothing. rest is allowed. potatoes need it to grow.', 'couch'],
    ['Starter 3 · meet Hype Potato', 'to: YOU', 'HI I\'M HYPE POTATO AND I\'M SO PROUD OF YOU FOR OPENING THIS APP AND READING THIS. THAT COUNTS.', 'hype'],
    ['Starter 4 · meet Nana Spud', 'to: you, my dear', 'hello love, i\'m nana spud. i\'ve been mashed, roasted and boiled, and here i still am. you\'ll be alright too.', 'nana'],
    ['Starter 5 · meet Tater Tot', 'to: you, from someone very small', 'hi!! i\'m tater tot. i tied my shoelace today. what\'s your small win? tell me!!', 'tot'],
    ['Starter 6 · meet Hot Potato', 'to: you, who keeps saying yes', 'hot potato here. "no" is a full sentence. say it with your chest.', 'spicy'],
    ['Starter 7 · meet Sweet Potato', 'to: you, having a hard time', 'hi, i\'m sweet potato. no advice today. just a very big, very soft hug. 🧡', 'sweet'],
    ['Starter 8 · Princess Potato', 'to: you, royalty', 'even princesses need potato days. take off the crown, put on the trackies, rest like it\'s your royal duty.', 'princess'],
    ['Starter 9 · the whole cast', 'to: you, from all of us', 'whichever potato you are today, you\'re welcome here. small potatoes still count.', 'spud'],
    // more letters
    ['Spud', 'to: you, growing quietly', 'potatoes sprout in the dark. so can you.', 'spud'],
    ['Spud', 'to: you, feeling a bit unseasoned', 'a little bland today? that\'s okay. you\'re still good.', 'spud'],
    ['Spud', 'to: you, on a monday', 'you don\'t have to do the whole week today. just today. maybe just the next hour.', 'spud'],
    ['Princess Potato', 'to: you, comparing yourself', 'a princess does not compare herself to other potatoes. she adjusts her crown and carries on.', 'princess'],
    ['Couch Potato', 'to: you, scrolling at midnight', 'this is your sign to put the phone down and go to sleep. i\'m already in bed. join me.', 'couch'],
    ['Couch Potato', 'to: you, feeling lazy', 'rest isn\'t lazy. it\'s the growing season. i would know.', 'couch'],
    ['Hype Potato', 'to: YOU, keeping score', 'DRANK WATER? WIN. REPLIED TO ONE MESSAGE? WIN. GOT OUT OF BED? HUGE WIN.', 'hype'],
    ['Hype Potato', 'to: you, not noticing', 'LOOK HOW FAR YOU\'VE ROLLED. HONESTLY? SPUD-TACULAR.', 'hype'],
    ['Nana Spud', 'to: you, in a hurry', 'slow down, love. the best roasts take their time.', 'nana'],
    ['Nana Spud', 'to: you, mid-change', 'every chip, roast and mash started as a plain old potato. becoming something new takes time.', 'nana'],
    ['Tater Tot', 'to: you, feeling small', 'i\'m the smallest potato and i still matter. so do you!!', 'tot'],
    ['Hot Potato', 'to: you, overthinking that text', 'they left you on read? their loss. you\'re a whole meal.', 'spicy'],
    ['Sweet Potato', 'to: you, after a hard week', 'you got a bit mashed this week. you\'re still whole. i\'m proud of you. 🧡', 'sweet'],
    ['Sweet Potato', 'to: someone you love', 'send this to the person who always makes you feel less mashed.', 'sweet'],
  ];
  const KEY = 'spud-post-maker-v2';
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const W = 1080, H = 1350;
  let st;
  try { st = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { st = null; }
  if (!st || !Array.isArray(st.slides) || !st.slides.length) st = { slides: [{ to: IDEAS[0][1], msg: IDEAS[0][2], sig: CAST.spud.sig, bg: 'blush', who: 'spud' }], cur: 0, handle: '@sincerely.spud' };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} };
  const toast = t => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.style.opacity = 0, 1700); setTimeout(() => e.remove(), 2200); };
  const slide = () => st.slides[st.cur];

  // ── Potato drawing: hand-drawn style ──────────────────────────────────
  // Every potato gets its own lumpy, seeded outline, inked twice with a slight wobble like a pen sketch.
  function rng(seed) { let x = seed * 9973 + 7; return () => { x = (x * 16807) % 2147483647; return (x - 1) / 2147483646; }; }
  const SEEDS = { spud: 11, princess: 23, couch: 37, hype: 41, nana: 53, tot: 67, spicy: 79, sweet: 97 };
  const SKINS = { normal: { fill: '#c99460', light: '#ddb17f', dark: '#a6743f', ink: '#4a301c' }, sweet: { fill: '#c9683f', light: '#e08a5c', dark: '#9f4a2a', ink: '#4a2416' } };
  function outlinePts(who) {
    const r = rng(SEEDS[who] || 5), pts = [], N = 22;
    const sweet = who === 'sweet';
    const rx = sweet ? 45 : 43, ry = sweet ? 27 : 31, cx = 50, cy = 58, tilt = (r() - .5) * .18;
    const lumps = [[r() * 6.28, 3 + r() * 3], [r() * 6.28, 2 + r() * 3], [r() * 6.28, -2 - r() * 2]];
    for (let i = 0; i < N; i++) {
      const t = i / N * Math.PI * 2;
      let k = 1 + (r() - .5) * .07;
      for (const [a, amt] of lumps) { const d = Math.atan2(Math.sin(t - a), Math.cos(t - a)); k += amt / 40 * Math.exp(-d * d * 6); }
      let x = Math.cos(t) * rx * k, y = Math.sin(t) * ry * k;
      if (sweet) x *= 1 + .12 * Math.abs(Math.cos(t)) ** 6; // pointy ends
      pts.push([cx + x * Math.cos(tilt) - y * Math.sin(tilt), cy + x * Math.sin(tilt) + y * Math.cos(tilt)]);
    }
    return pts;
  }
  function blob(c, pts, jit = 0, r) {
    const P = pts.map(([x, y]) => [x + (r ? (r() - .5) * jit : 0), y + (r ? (r() - .5) * jit : 0)]);
    c.beginPath();
    const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    let s = m(P[P.length - 1], P[0]); c.moveTo(s[0], s[1]);
    for (let i = 0; i < P.length; i++) { const n = m(P[i], P[(i + 1) % P.length]); c.quadraticCurveTo(P[i][0], P[i][1], n[0], n[1]); }
    c.closePath();
  }
  // a pen line drawn twice with a tiny wobble
  function ink(c, draw, col, w, r) {
    c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round';
    for (let pass = 0; pass < 2; pass++) {
      c.save(); c.translate((r() - .5) * .9, (r() - .5) * .9); c.lineWidth = w * (pass ? .55 : 1); c.globalAlpha = pass ? .55 : .95;
      c.beginPath(); draw(); c.stroke(); c.restore();
    }
  }
  function drawSpud(c, x, y, s, who) {
    const r = rng((SEEDS[who] || 5) + 1000);
    const K = who === 'sweet' ? SKINS.sweet : SKINS.normal;
    const pts = outlinePts(who);
    c.save(); c.translate(x, y); c.scale(s, s);
    if (who === 'tot') { c.translate(19, 26); c.scale(.62, .62); }

    // behind the body
    if (who === 'nana') { c.fillStyle = '#ece6dc'; blob(c, [[50, 14], [60, 16], [63, 25], [55, 32], [45, 30], [42, 21]]); c.fill(); ink(c, () => blob(c, [[50, 14], [60, 16], [63, 25], [55, 32], [45, 30], [42, 21]]), K.ink, 2, r); }
    if (who === 'tot' || who === 'sweet' || who === 'spud') {
      const leafCol = who === 'sweet' ? '#7a4fa0' : '#6f9c5a';
      c.fillStyle = leafCol;
      c.beginPath(); c.moveTo(52, 30); c.bezierCurveTo(52, 20, 60, 14, 68, 16); c.bezierCurveTo(64, 22, 59, 27, 54, 31); c.closePath();
      if (who !== 'spud') { c.fill(); ink(c, () => { c.moveTo(52, 30); c.bezierCurveTo(52, 20, 60, 14, 68, 16); c.bezierCurveTo(64, 22, 59, 27, 54, 31); }, K.ink, 1.6, r); }
    }

    // body: fill, then light and shade clipped inside, then speckles
    blob(c, pts); c.fillStyle = K.fill; c.fill();
    c.save(); blob(c, pts); c.clip();
    c.fillStyle = K.light; c.globalAlpha = .55; c.beginPath(); c.ellipse(36, 44, 26, 14, -.35, 0, 7); c.fill();
    c.fillStyle = K.dark; c.globalAlpha = .35; c.beginPath(); c.ellipse(56, 96, 52, 18, 0, 0, 7); c.fill();
    c.globalAlpha = .7; c.strokeStyle = K.dark; c.lineWidth = 1.3; c.lineCap = 'round';
    for (let i = 0; i < 9; i++) { const px = 15 + r() * 72, py = 34 + r() * 50; if (Math.abs(px - 50) < 24 && py > 46 && py < 74) continue; c.beginPath(); c.moveTo(px, py); c.quadraticCurveTo(px + 1.5, py - 1.5, px + 3, py + (r() - .5)); c.stroke(); }
    c.restore();
    ink(c, () => blob(c, pts, .6, r), K.ink, 2.4, r);

    // face pieces (slightly lopsided on purpose)
    const EL = [38, 55], ER = [61, 54];
    const dotEyes = (sz = 4.3) => { c.fillStyle = '#21160f'; c.beginPath(); c.ellipse(EL[0], EL[1], sz, sz * 1.1, .1, 0, 7); c.fill(); c.beginPath(); c.ellipse(ER[0], ER[1], sz * .93, sz * 1.05, -.1, 0, 7); c.fill(); };
    const shine = () => { c.fillStyle = '#fff'; c.beginPath(); c.arc(EL[0] + 1.5, EL[1] - 1.8, 1.5, 0, 7); c.fill(); c.beginPath(); c.arc(ER[0] + 1.5, ER[1] - 1.8, 1.3, 0, 7); c.fill(); };
    const closedEyes = () => ink(c, () => { c.moveTo(33, 55); c.quadraticCurveTo(38, 59, 43, 55); c.moveTo(56, 54); c.quadraticCurveTo(61, 58, 66, 54); }, '#21160f', 2.6, r);
    const smile = (w = 1) => ink(c, () => { c.moveTo(50 - 8 * w, 65); c.quadraticCurveTo(50, 72 + 2 * w, 50 + 8 * w, 64); }, '#21160f', 2.6, r);
    const blush = (col = 'rgba(236,128,128,.45)') => { c.fillStyle = col; c.beginPath(); c.ellipse(28, 64, 5.5, 3.3, -.1, 0, 7); c.fill(); c.beginPath(); c.ellipse(71, 63, 5, 3, .1, 0, 7); c.fill(); };

    switch (who) {
      case 'spud': {
        dotEyes(); smile(); blush('rgba(236,128,128,.3)');
        const bx = 31, by = 33; c.fillStyle = '#f07ab8';
        c.beginPath(); c.moveTo(bx, by); c.bezierCurveTo(bx - 8, by - 9, bx - 16, by - 6, bx - 15, by + 1); c.bezierCurveTo(bx - 14, by + 8, bx - 6, by + 6, bx, by); c.fill();
        c.beginPath(); c.moveTo(bx, by); c.bezierCurveTo(bx + 7, by - 10, bx + 16, by - 8, bx + 15, by - 1); c.bezierCurveTo(bx + 14, by + 6, bx + 6, by + 5, bx, by); c.fill();
        ink(c, () => { c.moveTo(bx, by); c.bezierCurveTo(bx - 8, by - 9, bx - 16, by - 6, bx - 15, by + 1); c.bezierCurveTo(bx - 14, by + 8, bx - 6, by + 6, bx, by); c.bezierCurveTo(bx + 7, by - 10, bx + 16, by - 8, bx + 15, by - 1); c.bezierCurveTo(bx + 14, by + 6, bx + 6, by + 5, bx, by); }, K.ink, 1.8, r);
        c.fillStyle = '#d95a9e'; c.beginPath(); c.ellipse(bx, by, 3, 3.4, 0, 0, 7); c.fill(); break;
      }
      case 'princess': {
        dotEyes(); smile(); blush();
        c.fillStyle = '#f0c44c';
        const cr = () => { c.moveTo(39, 32); c.lineTo(37, 18); c.lineTo(44, 25); c.lineTo(50, 14); c.lineTo(56, 24); c.lineTo(63, 17); c.lineTo(62, 31); c.quadraticCurveTo(50, 28, 39, 32); };
        c.beginPath(); cr(); c.fill(); ink(c, cr, K.ink, 1.8, r);
        c.fillStyle = '#f07ab8'; c.beginPath(); c.arc(50, 26, 2.2, 0, 7); c.fill(); break;
      }
      case 'couch': {
        closedEyes(); ink(c, () => { c.moveTo(47, 66); c.quadraticCurveTo(50, 68, 53, 66); }, '#21160f', 2.2, r); blush();
        const bl = () => { c.moveTo(4, 76); c.quadraticCurveTo(28, 68, 50, 72); c.quadraticCurveTo(74, 76, 96, 70); c.lineTo(94, 96); c.quadraticCurveTo(50, 99, 6, 96); c.closePath(); };
        c.fillStyle = '#b8a2e2'; c.beginPath(); bl(); c.fill();
        c.save(); c.beginPath(); bl(); c.clip(); c.strokeStyle = 'rgba(255,255,255,.65)'; c.lineWidth = 2.4; for (const yy of [82, 89]) { c.beginPath(); c.moveTo(4, yy); c.quadraticCurveTo(50, yy - 4, 96, yy - 1); c.stroke(); } c.restore();
        ink(c, bl, K.ink, 2, r);
        c.fillStyle = K.ink; c.font = '700 13px Caveat, cursive'; c.fillText('z', 84, 32); c.font = '700 10px Caveat, cursive'; c.fillText('z', 92, 23); break;
      }
      case 'hype': {
        c.save(); blob(c, pts); c.clip(); c.fillStyle = '#e4493f'; c.beginPath(); c.moveTo(0, 36); c.quadraticCurveTo(50, 31, 100, 37); c.lineTo(100, 44); c.quadraticCurveTo(50, 38, 0, 43); c.fill();
        c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.moveTo(0, 39); c.quadraticCurveTo(50, 34, 100, 40); c.lineTo(100, 41.5); c.quadraticCurveTo(50, 36, 0, 40.5); c.fill(); c.restore();
        dotEyes(4.8); shine(); blush();
        const mo = () => { c.moveTo(41, 64); c.quadraticCurveTo(50, 63, 59, 63); c.quadraticCurveTo(57, 76, 49, 75); c.quadraticCurveTo(42, 74, 41, 64); };
        c.fillStyle = '#6a2b22'; c.beginPath(); mo(); c.fill(); ink(c, mo, '#21160f', 2.2, r);
        ink(c, () => { for (const [ax, ay] of [[6, 30], [94, 28]]) { c.moveTo(ax - 4, ay); c.lineTo(ax + 4, ay); c.moveTo(ax, ay - 4); c.lineTo(ax, ay + 4); } }, '#e0a92a', 2.2, r); break;
      }
      case 'nana': {
        dotEyes(3.8); smile(.9); blush();
        ink(c, () => { c.ellipse(EL[0], EL[1], 8.5, 7.5, 0, 0, 7); c.moveTo(ER[0] + 8.5, ER[1]); c.ellipse(ER[0], ER[1], 8.5, 7.5, 0, 0, 7); c.moveTo(EL[0] + 8.5, EL[1] - 1); c.quadraticCurveTo(49.5, EL[1] - 4, ER[0] - 8.5, ER[1] - 1); }, '#3a2a40', 1.8, r);
        c.save(); blob(c, pts); c.clip(); c.fillStyle = '#ece6dc'; c.beginPath(); c.moveTo(0, 0); c.lineTo(100, 0); c.lineTo(100, 34); c.quadraticCurveTo(74, 41, 50, 36); c.quadraticCurveTo(26, 41, 0, 34); c.fill(); c.restore();
        c.save(); blob(c, pts); c.clip(); ink(c, () => { c.moveTo(0, 35); c.quadraticCurveTo(30, 41, 50, 36); c.quadraticCurveTo(70, 41, 100, 35); }, K.ink, 1.6, r); c.restore(); break;
      }
      case 'tot': dotEyes(5); shine(); ink(c, () => { c.moveTo(46, 66); c.quadraticCurveTo(50, 70, 54, 66); }, '#21160f', 2.4, r); blush(); break;
      case 'spicy': {
        ink(c, () => { c.moveTo(43, 67); c.quadraticCurveTo(53, 70, 60, 63); }, '#21160f', 2.6, r);
        const sg = () => { c.moveTo(27, 49); c.lineTo(46, 48); c.quadraticCurveTo(46, 60, 37, 60); c.quadraticCurveTo(28, 60, 27, 49); c.moveTo(53, 48); c.lineTo(72, 47); c.quadraticCurveTo(72, 59, 63, 59); c.quadraticCurveTo(54, 59, 53, 48); };
        c.fillStyle = '#1b1416'; c.beginPath(); sg(); c.fill(); ink(c, () => { c.moveTo(46, 49); c.lineTo(53, 49); c.moveTo(27, 49); c.lineTo(14, 47); c.moveTo(72, 47); c.lineTo(86, 45); }, '#1b1416', 2.4, r);
        c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(31, 51); c.lineTo(36, 51); c.moveTo(57, 50); c.lineTo(62, 50); c.stroke(); break;
      }
      case 'sweet': {
        closedEyes(); smile(.8);
        for (const [hx, hy, sz] of [[29, 64, 4.2], [70, 63, 3.8]]) { c.fillStyle = 'rgba(245,140,155,.8)'; c.beginPath(); c.moveTo(hx, hy + sz); c.bezierCurveTo(hx - sz * 1.5, hy, hx - sz * .6, hy - sz, hx, hy - sz * .2); c.bezierCurveTo(hx + sz * .6, hy - sz, hx + sz * 1.5, hy, hx, hy + sz); c.fill(); }
        break;
      }
    }
    c.restore();
  }

  // ── Text helpers ─────────────────────────────────────────────────────
  function wrap(c, text, maxW) {
    const out = [];
    for (const para of text.split('\n')) {
      const words = para.split(/\s+/).filter(Boolean); let line = '';
      for (const w of words) { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
      out.push(line);
    }
    return out;
  }

  function render(c, sl, idx, total) {
    const B = BGS[sl.bg] || BGS.butter;
    c.clearRect(0, 0, W, H);
    c.fillStyle = B.bg; c.fillRect(0, 0, W, H);
    if (B.lined) { c.strokeStyle = B.ink; c.globalAlpha = .07; c.lineWidth = 3; for (let y = 120; y < H; y += 74) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); } c.globalAlpha = 1; }
    // tape strip
    c.save(); c.translate(W / 2, 46); c.rotate(-.03); c.fillStyle = 'rgba(255,217,120,.85)'; c.fillRect(-110, -26, 220, 52); c.restore();
    const PAD = 96;
    // "to:" line
    c.fillStyle = B.accent; c.font = '700 64px Caveat, cursive'; c.textBaseline = 'alphabetic';
    if (sl.to.trim()) c.fillText(sl.to.trim(), PAD, 200);
    // letter, auto-sized
    c.fillStyle = B.ink;
    const box = { x: PAD, y: 270, w: W - PAD * 2, h: 600 };
    let size = 92, lines = [];
    while (size > 44) {
      c.font = `600 ${size}px Fredoka, sans-serif`;
      lines = wrap(c, sl.msg.trim() || 'write your letter…', box.w);
      if (lines.length * size * 1.22 <= box.h) break;
      size -= 4;
    }
    c.font = `600 ${size}px Fredoka, sans-serif`;
    if (!sl.msg.trim()) c.globalAlpha = .35;
    lines.forEach((l, i) => c.fillText(l, box.x, box.y + size + i * size * 1.22));
    c.globalAlpha = 1;
    // spud
    drawSpud(c, W - PAD - 340, H - 520, 3.4, sl.who);
    // signature
    c.fillStyle = B.accent; c.font = '700 76px Caveat, cursive'; c.textAlign = 'right';
    if (sl.sig.trim()) c.fillText(sl.sig.trim(), W - PAD, H - 120);
    c.textAlign = 'left';
    // handle
    if (st.handle.trim()) { c.font = '600 34px Nunito, sans-serif'; c.globalAlpha = .6; c.fillStyle = B.ink; const h = st.handle.trim(); c.fillText(h.startsWith('@') ? h : '@' + h, PAD, H - 64); c.globalAlpha = 1; }
    // carousel dots
    if (total > 1) {
      const gap = 30, x0 = W / 2 - (total - 1) * gap / 2;
      for (let i = 0; i < total; i++) { c.beginPath(); c.arc(x0 + i * gap, H - 40, i === idx ? 9 : 6, 0, 7); c.fillStyle = B.ink; c.globalAlpha = i === idx ? .8 : .25; c.fill(); }
      c.globalAlpha = 1;
      if (idx < total - 1) { c.fillStyle = B.accent; c.font = '700 54px Caveat, cursive'; c.textAlign = 'right'; c.fillText('swipe →', W - PAD, 200); c.textAlign = 'left'; }
    }
  }

  // ── UI ────────────────────────────────────────────────────────────────
  function opts(boxId, map, key, swatch) {
    const box = $(boxId); box.innerHTML = '';
    Object.entries(map).forEach(([k, v]) => {
      const b = document.createElement('button'); b.className = 'opt' + (slide()[key] === k ? ' on' : ''); b.type = 'button';
      b.innerHTML = swatch ? `<i style="background:${v.bg}"></i>${v.name}` : v;
      b.onclick = () => { slide()[key] = k; opts(boxId, map, key, swatch); draw(); };
      box.appendChild(b);
    });
  }
  function castOpts() {
    const box = $('moods'); box.innerHTML = '';
    Object.entries(CAST).forEach(([k, v]) => {
      const b = document.createElement('button'); b.className = 'opt' + (slide().who === k ? ' on' : ''); b.type = 'button'; b.textContent = v.label;
      b.onclick = () => { const s = slide(), old = CAST[s.who];
        if (!s.sig.trim() || (old && s.sig === old.sig)) s.sig = v.sig;
        if (old && s.bg === old.bg) s.bg = v.bg;
        s.who = k; fillForm(); draw(); };
      box.appendChild(b);
    });
    $('about').textContent = (CAST[slide().who] || CAST.spud).about;
  }
  function fillForm() { const s = slide(); $('to').value = s.to; $('msg').value = s.msg; $('sig').value = s.sig; opts('bgs', BGS, 'bg', true); castOpts(); }
  function thumbs() {
    const box = $('slides'); box.innerHTML = '';
    st.slides.forEach((s, i) => {
      const t = document.createElement('canvas'); t.width = W; t.height = H; render(t.getContext('2d'), s, i, st.slides.length);
      const b = document.createElement('button'); b.className = 'thumb' + (i === st.cur ? ' on' : ''); b.type = 'button'; b.setAttribute('aria-label', 'Slide ' + (i + 1));
      const img = new Image(); img.src = t.toDataURL('image/jpeg', .5); b.appendChild(img);
      b.onclick = () => { st.cur = i; fillForm(); draw(); };
      box.appendChild(b);
    });
    const add = document.createElement('button'); add.className = 'addslide'; add.type = 'button'; add.textContent = '+'; add.setAttribute('aria-label', 'Add slide');
    add.onclick = () => { const s = slide(); st.slides.push({ to: '', msg: '', sig: s.sig, bg: s.bg, who: s.who }); st.cur = st.slides.length - 1; fillForm(); draw(); $('msg').focus(); };
    box.appendChild(add);
  }
  let thumbT = 0;
  function draw() { render(ctx, slide(), st.cur, st.slides.length); save(); clearTimeout(thumbT); thumbT = setTimeout(thumbs, 250); }

  $('to').oninput = e => { slide().to = e.target.value; draw(); };
  $('msg').oninput = e => { slide().msg = e.target.value; draw(); };
  $('sig').oninput = e => { slide().sig = e.target.value; draw(); };
  $('handle').value = st.handle; $('handle').oninput = e => { st.handle = e.target.value; draw(); };
  $('dupe').onclick = () => { st.slides.splice(st.cur + 1, 0, { ...slide() }); st.cur++; fillForm(); draw(); toast('Slide copied'); };
  $('del').onclick = () => { if (st.slides.length === 1) { toast('This is the only slide'); return; } st.slides.splice(st.cur, 1); st.cur = Math.max(0, st.cur - 1); fillForm(); draw(); };
  const useIdea = i => { const [, to, msg, who] = IDEAS[i]; Object.assign(slide(), { to, msg, who, sig: CAST[who].sig, bg: CAST[who].bg }); fillForm(); draw(); };
  $('idea').onclick = () => { const mine = IDEAS.map((x, i) => [x, i]).filter(([x]) => x[3] === slide().who && !x[0].startsWith('Starter')); const pool = mine.length ? mine : IDEAS.map((x, i) => [x, i]); useIdea(pool[(Math.random() * pool.length) | 0][1]); };
  IDEAS.forEach(([title, to, msg], i) => { const b = document.createElement('button'); b.className = 'idea'; b.type = 'button'; b.innerHTML = `<b>${title}</b>${msg}`; b.onclick = () => { useIdea(i); window.scrollTo({ top: 0, behavior: 'smooth' }); }; $('ideas').appendChild(b); });

  // ── Save ──────────────────────────────────────────────────────────────
  const toBlob = c => new Promise(r => c.toBlob(r, 'image/png'));
  $('save').onclick = async () => {
    const files = [];
    for (let i = 0; i < st.slides.length; i++) {
      const t = document.createElement('canvas'); t.width = W; t.height = H; render(t.getContext('2d'), st.slides[i], i, st.slides.length);
      files.push(new File([await toBlob(t)], `spud-post-${i + 1}.png`, { type: 'image/png' }));
    }
    if (navigator.canShare && navigator.canShare({ files }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
      try { await navigator.share({ files }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    for (const f of files) { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); await new Promise(r => setTimeout(r, 300)); }
    toast(files.length > 1 ? `Saved ${files.length} slides` : 'Saved!');
  };

  window.__spud = { st, render };
  fillForm();
  // wait for fonts so the canvas uses them
  Promise.all(['600 40px Fredoka', '700 40px Caveat', '600 20px Nunito'].map(f => document.fonts.load(f))).finally(() => draw());
  draw();
})();
</script>
</body>
</html>
